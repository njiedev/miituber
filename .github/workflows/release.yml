name: Release

# Fires ONLY when you push a version tag like v0.2.0 — never on a normal commit.
# That tag push is the deliberate "cut a release" act; ordinary commits to main
# do nothing here.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      # tauri-action needs write access to create the GitHub Release + upload assets.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 0.2.0 release remains Windows-only while public macOS signing
          # and notarization are deferred. macOS transparency support remains
          # in the application for local testing and a future Mac release.
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          # Provided automatically by GitHub — lets the action create the Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your updater signing key (Part A). Bundles are signed from day one so
          # they're update-ready the moment you wire the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Use the tag that triggered the run (e.g. v0.2.0) as the release tag.
          tagName: ${{ github.ref_name }}
          releaseName: "MiiTuber ${{ github.ref_name }}"
          releaseBody: |
            ## What’s New in MiiTuber 0.2.0

            - Added microphone-only animation for camera-free PNGTuber use.
            - Added separate camera and microphone mouth activation controls.
            - Added native Save JSON and Import JSON controls for tuning profiles.
            - Fixed a bug where microphone lip-sync would not move the Mii without camera tracking.
            - Fixed a bug where losing face detection could stop microphone mouth movement.
            - Fixed a bug where selecting a Mii could play dialogue audio with no dialogue visible.
            - Fixed a bug where starting microphone or camera tracking could play dialogue audio.

            Thanks for 200 downloads! — 3wb <3

            **Compatibility note:** Mii Creator's new update includes custom features that may not yet work with MiiTuber. Avoid those custom features while compatibility work is underway.
          # Publish as a DRAFT so you review/edit notes before it goes public.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
